name: Build and release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: |
          go test -race ./...
          go vet ./...
      - name: Build release binaries
        env:
          CGO_ENABLED: '0'
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w -X main.version=$VERSION" -o dist/ci-transfer ./cmd/ci-transfer
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w -X main.version=$VERSION" -o dist/ci-transfer.exe ./cmd/ci-transfer
          GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="-s -w -X main.version=$VERSION" -o dist/ci-transfer.macos ./cmd/ci-transfer
          GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags="-s -w -X main.version=$VERSION" -o dist/ci-transfer.macos-amd64 ./cmd/ci-transfer
          cd dist
          sha256sum ci-transfer* > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: ci-transfer
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ci-transfer
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
